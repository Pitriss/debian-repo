# Temporary manual diagnostic. A successful deployment replaces the published
# Pages site with a tiny test page. Restore it with publish.yml afterwards.
name: Diagnose GitHub Pages (tiny artifact)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not race the production APT deployment.
concurrency:
  group: debian-repository-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create tiny diagnostic site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/pages-smoke
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><title>GitHub Pages smoke test</title><h1>GitHub Pages smoke test</h1><p>Run %s, attempt %s</p></html>\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .tmp/pages-smoke/index.html
          touch .tmp/pages-smoke/.nojekyll
          wc -c .tmp/pages-smoke/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload tiny Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/pages-smoke

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tiny Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
